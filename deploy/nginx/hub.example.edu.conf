server {
    listen 80;
    listen [::]:80;
    server_name hub.example.edu;

    access_log /var/log/nginx/hydro-league-access.log;
    error_log /var/log/nginx/hydro-league-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.example.edu;

    ssl_certificate /etc/letsencrypt/live/hub.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:HydroLeagueSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;
    client_max_body_size 8m;

    access_log /var/log/nginx/hydro-league-access.log;
    error_log /var/log/nginx/hydro-league-error.log;

    # Administrative configuration remains reachable only through an SSH tunnel
    # to the Hub loopback port, never through the public virtual host.
    location = /api/v1/admin {
        return 404;
    }

    location ^~ /api/v1/admin/ {
        return 404;
    }

    location ~ ^/api/v1/leagues/[^/]+/(finalize|publish-results)/?$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
