name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash -n deploy/school/install-beta9.sh
      - run: npm pack --workspace hydro-league-agent --dry-run
      - run: docker build --file Dockerfile.hub --tag hydro-league-hub:ci .
